name: Go CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
            upx: true
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
            upx: true
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
            upx: false
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
            upx: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Install UPX
        if: matrix.target.upx
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Build project
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o "dist/Rshell-${{ matrix.target.name }}${{ matrix.target.ext }}" ./main.go

      - name: Compress binary with UPX
        if: matrix.target.upx
        run: upx --best --lzma "dist/Rshell-${{ matrix.target.name }}${{ matrix.target.ext }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rshell-${{ matrix.target.name }}
          path: dist/Rshell-${{ matrix.target.name }}${{ matrix.target.ext }}

  release-latest:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p release-dist
          find release-assets -type f -exec cp {} release-dist/ \;
          ls -lah release-dist

      - name: Move latest tag
        run: |
          git tag -fa latest -m "Latest build from ${GITHUB_SHA}"
          git push origin refs/tags/latest --force

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          body: |
            Automated latest release for commit ${{ github.sha }}.
          files: release-dist/*
          overwrite_files: true
          make_latest: true
